name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          NEXT_PUBLIC_MEMBERS_CSV: ${{ secrets.MEMBERS_CSV }}
          NEXT_PUBLIC_PROJECTS_CSV: ${{ secrets.PROJECTS_CSV }}
          NEXT_PUBLIC_TASKS_CSV: ${{ secrets.TASKS_CSV }}
          NEXT_PUBLIC_GAS_URL: ${{ secrets.CSV_GAS }}
          NEXT_PUBLIC_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          NEXT_PUBLIC_SETTINGS_CSV: ${{ secrets.SETTINGS_CSV }}
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
